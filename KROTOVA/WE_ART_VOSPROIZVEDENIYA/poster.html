<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дарья Кротова — Воспроизведения · WE ART GALLERY</title>
<style>
  /* Noto Serif Display (OFL) — высококонтрастная антиква с кириллицей и осью ширины,
     ближе всего к узкой Didone из логотипа WE ART */
  @font-face {
    font-family: "Noto Serif Display";
    src: url("fonts/NotoSerifDisplay.ttf") format("truetype");
    font-weight: 100 900;
    font-stretch: 62.5% 100%;
  }
  :root { --ink: #1c1c1c; --margin: 56px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 853px; background: #f8f8f8; }
  .poster { position: relative; width: 1280px; height: 853px; overflow: hidden;
            font-family: "Noto Serif Display", serif; color: var(--ink);
            -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .poster > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* верх: имя художника (мелко) + название выставки (крупно) */
  .artist { position: absolute; left: var(--margin); top: 30px;
            font-size: 21px; font-weight: 400; font-stretch: 100%; letter-spacing: .07em; line-height: 1; }
  .title  { position: absolute; left: calc(var(--margin) - 3px); top: 52px;
            font-size: 92px; font-weight: 600; font-stretch: 62.5%; letter-spacing: 0; line-height: 1; white-space: nowrap; }

  /* левый нижний угол: текстовый логотип WE ART GALLERY + даты */
  .brand  { position: absolute; left: var(--margin); bottom: var(--margin); display: inline-block; }
  .brand .mark    { display: block; font-size: 84px; font-weight: 700; font-stretch: 62.5%; line-height: .8;
                    letter-spacing: .01em; white-space: nowrap; margin-left: -2px; }
  .brand .gallery { display: block; margin-top: 18px; font-size: 15px; font-weight: 500; font-stretch: 100%;
                    letter-spacing: .5em; line-height: 1; white-space: nowrap; }
  .brand .dates   { display: block; margin-top: 22px; font-size: 19px; font-weight: 400; font-stretch: 100%;
                    letter-spacing: .06em; line-height: 1; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
  <div class="poster">
    <img src="source.jpg" alt="">
    <div class="artist">Дарья Кротова</div>
    <div class="title">Воспроизведения</div>
    <div class="brand">
      <span class="mark">WE ART</span>
      <span class="gallery">GALLERY</span>
      <span class="dates">10.10.26 – 05.11.26</span>
    </div>
  </div>
</body>
</html>
